name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run runtime:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: magga_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d magga_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/magga_ci
      BETTER_AUTH_SECRET: magga-ci-disposable-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run runtime:check
      - name: Create disposable database policy prerequisites
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE authenticated;
          CREATE SCHEMA private;
          CREATE FUNCTION private.current_user_id() RETURNS text LANGUAGE sql AS 'SELECT NULL::text';
          CREATE FUNCTION private.is_admin() RETURNS boolean LANGUAGE sql AS 'SELECT false';
          SQL
      - name: Create disposable database schema
        run: bun run db:push --force
      - run: bun run build
